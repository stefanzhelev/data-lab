models:
  - name: customers_clean
    description: One row per customer, latest version wins.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]

  - name: customers_quarantine
    description: Customer rows that failed a rule, with the raw text and reason.

  - name: orders_enriched
    description: Valid orders joined to the customer's country.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('customers_clean')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('valid_statuses') }}"
      - name: amount
        data_tests: [not_null]

  - name: orders_quarantine
    description: Order lines that failed one or more rules; reject_reason is ';'-separated.
    columns:
      - name: reject_reason
        data_tests: [not_null]

  - name: daily_revenue
    description: Revenue and order count per day and country, excluding cancelled orders.
