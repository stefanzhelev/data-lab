sources:
  - name: raw
    description: Raw CSV drops, read as text so nothing is coerced before we look at it.
    meta:
      external_location: "read_csv('../data/raw/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: customers
        description: Customer master; contains duplicates, padding, mixed case and a non-ISO date.
      - name: orders
        description: Order lines; contains about 15 planted defects (see the demo README).
