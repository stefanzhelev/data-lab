name: messy_orders
version: "0.1.0"
config-version: 2
profile: messy_orders

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

on-run-end:
  - "{{ publish_marts() }}"

models:
  messy_orders:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      # Copied to publish/<model>.parquet by the on-run-end hook (macros/publish_marts.sql)
      +materialized: table

vars:
  valid_statuses: ["shipped", "delivered", "refunded", "cancelled"]
