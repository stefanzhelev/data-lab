# Repo tooling: the barnacles gallery in marimo/ and linting.
# Notebooks also declare their own dependencies inline (PEP 723) for `marimo edit --sandbox`;
# barnacles exports them in this environment, so anything a notebook imports belongs here too.
[project]
name = "data-lab"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "barnacles>=0.2.1",
    "marimo>=0.26",
    "duckdb",
    "pandas",
    "altair",
    "ruff>=0.8",
]
# The notebooks in marimo/jupyter: `uv run --group jupyter jupyter lab`
jupyter = ["jupyterlab"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/.venv", "marimo/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"marimo/notebooks/*.py" = ["B018"]  # marimo renders a cell's last expression
"marimo/jupyter/*.ipynb" = ["E501"]  # copied study notebooks: long SQL strings, aligned comments

[tool.ruff.lint.isort]
known-third-party = ["marimo"]  # not the marimo/ gallery folder at the repo root

[tool.ruff.format]
exclude = ["marimo/jupyter/*.ipynb"]  # keep the copied notebooks' own layout
