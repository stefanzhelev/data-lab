# Repo tooling: the BI tools under bi/ (barnacles gallery in bi/marimo, Jupyter in bi/jupyter) and linting.
# Notebooks also declare their own dependencies inline (PEP 723) for `marimo edit --sandbox`;
# barnacles exports them in this environment, so anything a notebook imports belongs here too.
[project]
name = "data-lab"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "barnacles>=0.4.0",
    "marimo>=0.26",
    "duckdb",
    "pandas",
    "altair",
    "ruff>=0.8",
    "sqlglot>=30.35.0",
]
# The notebooks in bi/jupyter: `uv run --group jupyter jupyter lab`
jupyter = ["jupyterlab"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/.venv", "bi/marimo/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"bi/marimo/notebooks/**/*.py" = ["B018"]  # marimo renders a cell's last expression
"bi/jupyter/*.ipynb" = ["E501"]  # copied study notebooks: long SQL strings, aligned comments


[tool.ruff.format]
exclude = ["bi/jupyter/*.ipynb"]  # keep the copied notebooks' own layout
