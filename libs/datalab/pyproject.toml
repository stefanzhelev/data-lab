[project]
name = "stefanzhelev-datalab"
version = "0.2.0"
description = "Load remote CSV/Parquet into DuckDB, identically in marimo WASM (Pyodide) and locally"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Zhelev" }]
keywords = ["duckdb", "marimo", "pyodide", "wasm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# duckdb is deliberately not a hard dependency: in the browser it comes from
# Pyodide's own build, and every notebook already declares it.
dependencies = []

[project.optional-dependencies]
local = ["duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/stefanzhelev/data-lab"
Issues = "https://github.com/stefanzhelev/data-lab/issues"

[dependency-groups]
dev = ["duckdb>=1.1", "pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stefanzhelev_datalab"
