name: "Pipeline: messy-orders"

# dbt build (tests included) -> publish parquet + raw CSVs to R2 -> refresh the
# data index -> rebuild the site so dashboards pre-render against the new data.

on:
  push:
    branches: [main]
    paths:
      - projects/messy-orders/dbt/**
      - projects/messy-orders/data/**
      - projects/messy-orders/demo.yml
      - .github/workflows/messy-orders-pipeline.yml
  pull_request:
    paths:
      - projects/messy-orders/dbt/**
      - projects/messy-orders/data/**
  schedule:
    - cron: "0 5 * * 1" # weekly, so the pipeline visibly keeps running
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-messy-orders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/messy-orders/dbt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: dbt build (models + tests + reconciliation)
        run: uv run dbt build --profiles-dir .
      - uses: actions/upload-artifact@v5
        with:
          name: messy-orders-publish
          path: |
            projects/messy-orders/dbt/publish/*.parquet
            projects/messy-orders/data/raw/*.csv

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't support the newer default checksum headers of AWS CLI v2.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      DEST: s3://${{ secrets.R2_BUCKET }}/messy-orders
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: messy-orders-publish
          path: out
      - name: Upload to R2
        run: |
          aws s3 cp out/dbt/publish/ "$DEST/" --recursive --exclude "*" --include "*.parquet" \
            --endpoint-url "$ENDPOINT" --cache-control "public, max-age=300"
          aws s3 cp out/data/raw/ "$DEST/raw/" --recursive --exclude "*" --include "*.csv" \
            --endpoint-url "$ENDPOINT" --content-type "text/csv" --cache-control "public, max-age=300"

  index:
    needs: publish
    uses: ./.github/workflows/data-index.yml
    secrets: inherit

  site:
    needs: publish
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
