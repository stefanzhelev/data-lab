name: Deploy site

# dbt docs per demo -> marimo islands -> SvelteKit static build -> Cloudflare Pages.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/**
      - libs/datalab/src/**
      - libs/datalab/pyproject.toml
      - projects/*/dashboards/**
      - projects/*/demo.yml
      - .github/workflows/deploy-pages.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: dbt docs for every demo that has a dbt project
        run: |
          for dbt_dir in projects/*/dbt; do
            demo=$(basename "$(dirname "$dbt_dir")")
            (cd "$dbt_dir" && uv run dbt build --profiles-dir . --quiet && uv run dbt docs generate --profiles-dir . --static --quiet)
            mkdir -p "site/static/$demo/dbt-docs"
            cp "$dbt_dir/target/static_index.html" "site/static/$demo/dbt-docs/index.html"
          done

      - name: Bundle the stefanzhelev-datalab wheel (installed by notebooks in the browser)
        run: |
          uv build --wheel libs/datalab --out-dir site/static/wheels
          # Every wheel URL a notebook references must be in this build.
          for whl in $(grep -ho 'stefanzhelev_datalab-[^"]*\.whl' projects/*/dashboards/*.py | sort -u); do
            test -f "site/static/wheels/$whl" || { echo "::error::$whl is referenced by a notebook but not built (bump the URL to match libs/datalab/pyproject.toml)"; exit 1; }
          done

      - name: Render marimo islands
        run: uv run scripts/build_islands.py

      - name: Build site
        working-directory: site
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/build --project-name=stefanzhelev-datalab --branch=main
