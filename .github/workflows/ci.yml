name: CI

# Lint + check the notebooks, build the barnacles gallery (marimo/dist), and on
# main deploy it to Cloudflare Pages (lab.stefanzhelev.com, see infra/cloudflare.tf).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Check marimo notebooks
        run: uv run marimo check marimo/notebooks/*.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for card thumbnails
        run: uv run barnacles install-browser --with-deps
      - name: Build the barnacles gallery
        run: uv run barnacles build marimo
      - uses: actions/upload-artifact@v5
        with:
          name: gallery
          path: marimo/dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: gallery
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stefanzhelev-datalab --branch=main
