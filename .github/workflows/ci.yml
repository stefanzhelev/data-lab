name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check libs scripts projects
      - name: Test stefanzhelev-datalab
        working-directory: libs/datalab
        run: uv run --group dev pytest -q
      - name: Check marimo notebooks
        run: uvx marimo check projects/*/dashboards/*.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Empty manifest (islands are built in deploy-pages)
        run: mkdir -p src/generated && echo '{"demos":[]}' > src/generated/manifest.json
      - run: npm run check
      - run: npm run lint
